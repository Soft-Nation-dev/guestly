name: Frontend checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - run: npm run lint
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Run API-backed authentication browser checks
        run: |
          node tests/auth-api-fixture.mjs > /tmp/guestly-auth-fixture.log 2>&1 &
          NEXT_PUBLIC_API_URL=http://127.0.0.1:4100 npm run dev -- --hostname 127.0.0.1 --port 3100 > /tmp/guestly-auth-app.log 2>&1 &
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:3100/login > /dev/null; then break; fi
            sleep 1
          done
          node tests/live-auth-smoke.mjs
          node tests/live-bookings-smoke.mjs
          node tests/live-checkins-smoke.mjs
          node tests/live-services-concierge-smoke.mjs
          node tests/live-reporting-loyalty-smoke.mjs
