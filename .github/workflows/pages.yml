name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_PAGES: "true"
      NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      NEXT_PUBLIC_API_URL: https://guestly-api-zxgm.onrender.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - name: Verify hosted Guestly API
        run: node tests/hosted-api-smoke.mjs
      - run: npm run build
      - run: npm install --no-save --package-lock=false playwright
      - run: npx playwright install --with-deps chromium
      - name: Test the static site
        if: env.NEXT_PUBLIC_API_URL == ''
        env:
          SMOKE_BASE_URL: http://127.0.0.1:3000/${{ github.event.repository.name }}
        run: |
          mkdir -p /tmp/guestly-pages
          cp -a out "/tmp/guestly-pages${NEXT_PUBLIC_BASE_PATH}"
          python3 -m http.server 3000 --bind 127.0.0.1 --directory /tmp/guestly-pages > /tmp/guestly-pages.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS "$SMOKE_BASE_URL/" > /dev/null; then break; fi
            sleep 1
          done
          node tests/frontend-smoke.mjs
      - name: Check connected static pages
        if: env.NEXT_PUBLIC_API_URL != ''
        run: |
          test -f out/index.html
          test -f out/login/index.html
          test -f out/rooms/index.html
          grep -RqF "$NEXT_PUBLIC_API_URL" out/_next/static
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Publish Guestly
        id: deployment
        uses: actions/deploy-pages@v4
